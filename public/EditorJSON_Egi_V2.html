<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor JSON Egi V2</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#101827;color:#eef;margin:auto;padding:15px;max-width:1100px}button,input,textarea,select{font:inherit}button{padding:9px;margin:3px;background:#244c77;color:white;border:1px solid #587ba2;border-radius:8px}button:disabled{opacity:.4}input,textarea,select{background:#17243a;color:white;border:1px solid #61738c;border-radius:6px;padding:8px;max-width:100%}textarea{width:100%;height:48vh;font:13px monospace}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}section{background:#19263a;padding:12px;border-radius:12px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.item{border-left:2px solid #426b9a;margin:5px 0 5px 12px;padding-left:9px}.node{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 0}.key{color:#a9d5ff;font-weight:600;overflow-wrap:anywhere}.muted{color:#a9b9ca}.good{color:#79e4a2}.bad{color:#ff9898}#tree{max-height:65vh;overflow:auto}summary{cursor:pointer}small{color:#a9b9ca}#status{white-space:pre-wrap}button.danger{background:#713142}button.green{background:#205c49}</style></head><body><header><h2>📂 Editor JSON Egi <small>V2</small></h2><span id="filename">Novo arquivo</span></header><section><div class="row"><input id="file" type="file" accept=".json,application/json"><button onclick="formatJSON()">Formatar / validar</button><button onclick="backup()">Backup original</button><button class="green" onclick="save()">Salvar JSON</button></div><div class="row"><button onclick="setMode('visual')">Editor visual</button><button onclick="setMode('text')">Editor texto</button><button onclick="addRoot()">Adicionar campo na raiz</button><input id="search" placeholder="Buscar chave ou valor" oninput="render()"></div><div id="status" role="status" class="muted">Abra um JSON ou comece editando o exemplo. Os dados ficam neste navegador.</div></section><section id="visual"><h3>Editor visual</h3><p class="muted">Clique em Editar para modificar valores. Objetos e listas podem ser expandidos. Alterações são mantidas até salvar.</p><div id="tree"></div></section><section id="textSection" hidden><h3>Editor de texto</h3><textarea id="editor" spellcheck="false"></textarea><div><button onclick="applyText()">Aplicar alterações e validar</button></div></section><script>
'use strict';let data={nome:'Exemplo',ativo:true,moedas:['BTC_USDT','ETH_USDT'],configuracao:{intervalo:'Min15',limite:10}},original=JSON.stringify(data,null,2),filename='dados.json';const $=id=>document.getElementById(id);const clone=x=>JSON.parse(JSON.stringify(x));function msg(s,ok=true){$('status').textContent=s;$('status').className=ok?'good':'bad'}function download(content,name){const u=URL.createObjectURL(new Blob([content],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function save(){if(!$('textSection').hidden&&!applyText())return;download(JSON.stringify(data,null,2),filename);msg('Arquivo exportado: '+filename+'. Confira a pasta Downloads.')}function backup(){download(original,filename.replace(/\.json$/i,'')+'_backup_original.json');msg('Backup do conteúdo original exportado.')}function formatJSON(){if(!$('textSection').hidden){if(!applyText())return} $('editor').value=JSON.stringify(data,null,2);msg('JSON válido e formatado.')}function applyText(){try{data=JSON.parse($('editor').value);render();msg('JSON válido. Alterações aplicadas.');return true}catch(e){msg('Erro no JSON: '+e.message,false);return false}}function setMode(m){if(m==='visual'){if(!$('textSection').hidden&&!applyText())return;$('visual').hidden=false;$('textSection').hidden=true;render()}else{$('editor').value=JSON.stringify(data,null,2);$('visual').hidden=true;$('textSection').hidden=false}}$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const t=await f.text();const obj=JSON.parse(t);data=obj;original=JSON.stringify(obj,null,2);filename=f.name;$('filename').textContent=filename;$('editor').value=original;render();msg('Arquivo aberto: '+filename)}catch(err){msg('Não foi possível abrir: '+err.message,false)}e.target.value=''});function at(path){return path.reduce((a,k)=>a[k],data)}function replace(path,val){if(!path.length)data=val;else at(path.slice(0,-1))[path.at(-1)]=val;render()}function parseValue(v){try{return JSON.parse(v)}catch{return v}}function edit(path){const current=at(path);const text=prompt('Novo valor (JSON válido para números, booleanos, listas e objetos; texto comum para strings):',typeof current==='string'?current:JSON.stringify(current));if(text===null)return;replace(path,parseValue(text));msg('Valor alterado. Clique em Salvar JSON para exportar.')}function remove(path){if(!path.length){msg('A raiz não pode ser excluída.',false);return}if(!confirm('Excluir este campo?'))return;const parent=at(path.slice(0,-1)),key=path.at(-1);if(Array.isArray(parent))parent.splice(key,1);else delete parent[key];render();msg('Campo excluído.')}function add(path){const parent=at(path);if(!parent||typeof parent!=='object'){msg('Selecione objeto ou lista.',false);return}let key;if(!Array.isArray(parent)){key=prompt('Nome do novo campo:');if(key===null||!key.trim())return;if(Object.prototype.hasOwnProperty.call(parent,key)){msg('Campo já existe.',false);return}}const value=prompt('Valor inicial (ex.: 10, true, null, [], {}, ou texto):','');if(value===null)return;if(Array.isArray(parent))parent.push(parseValue(value));else parent[key]=parseValue(value);render();msg('Campo adicionado.')}function addRoot(){if(!data||typeof data!=='object'){msg('A raiz precisa ser um objeto ou lista para adicionar campos.',false);return}add([])}function btn(text,fn,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}function render(){const root=$('tree');root.replaceChildren();const query=$('search').value.toLowerCase();let count=0;function walk(value,path,label,depth){if(count++>3000){root.append('Limite visual de 3.000 nós. Use o editor de texto para arquivos maiores.');return}const isObj=value!==null&&typeof value==='object';const repr=isObj?(Array.isArray(value)?`Lista (${value.length})`:`Objeto (${Object.keys(value).length})`):JSON.stringify(value);if(query&&!String(label).toLowerCase().includes(query)&&!String(repr).toLowerCase().includes(query)){if(!isObj||!JSON.stringify(value).toLowerCase().includes(query))return}const wrap=document.createElement('div');wrap.className='item';const line=document.createElement('div');line.className='node';const k=document.createElement('span');k.className='key';k.textContent=label+':';line.append(k);const v=document.createElement('span');v.textContent=repr;line.append(v);line.append(btn('Editar',()=>edit(path)));if(isObj)line.append(btn('+ Campo',()=>add(path)));if(path.length)line.append(btn('Excluir',()=>remove(path),'danger'));wrap.append(line);if(isObj&&depth<15){const details=document.createElement('details');details.open=depth<2||!!query;const summary=document.createElement('summary');summary.textContent='Exibir / ocultar conteúdo';details.append(summary);Object.keys(value).forEach(key=>walkInto(value[key],[...path,Array.isArray(value)?Number(key):key],key,depth+1,details));wrap.append(details)}else if(isObj){const small=document.createElement('small');small.textContent='Profundidade máxima da visualização atingida; use o editor de texto.';wrap.append(small)}return wrap}function walkInto(value,path,label,depth,parent){const node=walk(value,path,label,depth);if(node)parent.append(node)}walkInto(data,[],'Raiz',0,root)}$('editor').value=original;render();
</script></body></html>
