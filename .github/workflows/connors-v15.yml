name: Connors V1.5 LAB validation
on:
  push:
    branches: [lab/connors-v15]
    paths:
      - 'lab/connors/auditoria-v15.mjs'
      - '.github/workflows/connors-v15.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node lab/connors/auditoria-v15.mjs --test
      - run: node lab/connors/notificar-v15.mjs --test
      - run: node lab/connors/auditoria-v15.mjs
      - run: node lab/connors/notificar-v15.mjs
        env:
          NTFY_ENABLED: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: connors-v15-auditoria
          path: |
            lab/connors/auditoria-v15.json
            lab/connors/notificacoes-v15.json
