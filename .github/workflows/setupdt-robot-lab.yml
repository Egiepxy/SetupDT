name: SetupDT Robot LAB
on:
  workflow_dispatch:
  push:
    branches: [lab/setupdt-robot-v11]
    paths: ['.github/workflows/setupdt-robot-lab.yml', 'lab/setupdt-robot/scripts/**']
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: setupdt-robot-lab
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/lab/setupdt-robot-v11' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
      - name: Checkout persistent LAB branch
        uses: actions/checkout@v4
        with:
          ref: lab/setupdt-robot-v11
          path: labstate
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline selftests
        working-directory: labstate
        run: node lab/setupdt-robot/scripts/selftest.mjs
      - name: Scan closed candles and update state
        working-directory: labstate
        env:
          SETUPDT_TELEGRAM_ENABLED: '0'
          SETUPDT_STATE_PATH: lab/setupdt-robot/state.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node lab/setupdt-robot/scripts/scan.mjs
      - name: Persist read-only results in LAB
        working-directory: labstate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/setupdt-robot/state.json lab/setupdt-robot/state.json.backup.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore(lab): update SetupDT signal state"
            git push origin HEAD:refs/heads/lab/setupdt-robot-v11
          fi
